name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:

  # ── 1. Unit tests ────────────────────────────────────────────────────────
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

  # ── 2. Syntax check ──────────────────────────────────────────────────────
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile all Python files
        run: |
          python -m py_compile service.shelly.shutdown/service.py
          python -m py_compile service.shelly.shutdown/shelly_client.py
          echo "All Python files syntax OK"

  # ── 3. XML validation ────────────────────────────────────────────────────
  xml:
    name: XML validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate addon XML files
        run: |
          python - << 'EOF'
          import xml.etree.ElementTree as ET
          import sys

          files = [
              "service.shelly.shutdown/addon.xml",
              "service.shelly.shutdown/resources/settings.xml",
              "repository.windowclaw.shelly/addon.xml",
          ]
          errors = []
          for path in files:
              try:
                  ET.parse(path)
                  print(f"OK: {path}")
              except Exception as e:
                  errors.append(f"FAIL: {path}: {e}")
                  print(f"FAIL: {path}: {e}")

          if errors:
              sys.exit(1)
          EOF

  # ── 4. Addon structure check ─────────────────────────────────────────────
  structure:
    name: Addon structure check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required files
        run: |
          python - << 'EOF'
          import os, sys, xml.etree.ElementTree as ET

          required = [
              "service.shelly.shutdown/addon.xml",
              "service.shelly.shutdown/service.py",
              "service.shelly.shutdown/shelly_client.py",
              "service.shelly.shutdown/LICENSE.txt",
              "service.shelly.shutdown/changelog.txt",
              "service.shelly.shutdown/icon.png",
              "service.shelly.shutdown/fanart.png",
              "service.shelly.shutdown/resources/settings.xml",
              "service.shelly.shutdown/resources/language/resource.language.en_gb/strings.po",
              "service.shelly.shutdown/resources/language/resource.language.de_de/strings.po",
              "repository.windowclaw.shelly/addon.xml",
              "tests/test_shelly_client.py",
          ]

          errors = []
          for path in required:
              if os.path.isfile(path):
                  print(f"OK: {path}")
              else:
                  errors.append(path)
                  print(f"MISSING: {path}")

          # Check addon.xml has no placeholder values
          tree = ET.parse("service.shelly.shutdown/addon.xml")
          root = tree.getroot()
          provider = root.attrib.get("provider-name","")
          if provider in ("", "YourName"):
              errors.append(f"addon.xml: provider-name is placeholder: '{provider}'")
              print(f"FAIL: provider-name='{provider}'")
          else:
              print(f"OK: provider-name='{provider}'")

          meta = root.find(".//extension[@point='xbmc.addon.metadata']")
          assets = meta.find("assets") if meta is not None else None
          if assets is None:
              errors.append("addon.xml: missing <assets> block")
              print("FAIL: missing <assets> block")
          else:
              print("OK: <assets> block present")

          # Check Python version requirement
          requires = root.find("requires")
          py = requires.find(".//import[@addon='xbmc.python']") if requires else None
          if py is not None:
              ver = py.attrib.get("version","")
              if not ver.startswith("3"):
                  errors.append(f"addon.xml: xbmc.python version '{ver}' is not Python 3")
              else:
                  print(f"OK: xbmc.python version={ver}")

          if errors:
              print(f"\n{len(errors)} error(s) found:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          else:
              print("\nAll checks passed.")
          EOF

  # ── 5. Build release ZIP ─────────────────────────────────────────────────
  build:
    name: Build release ZIP
    runs-on: ubuntu-latest
    needs: [test, syntax, xml, structure]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build addon ZIP and repository files
        run: |
          python - << 'EOF'
          import hashlib, re, zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          ADDON_DIR = Path("service.shelly.shutdown")
          REPO_DIR  = Path("repository.windowclaw.shelly")
          DIST      = Path("dist")
          DIST.mkdir(exist_ok=True)

          EXCLUDE = {"__pycache__", "tests", ".git"}

          def skip(rel):
              return any(p in EXCLUDE for p in rel.parts) or \
                     rel.suffix in {".pyc", ".pyo"}

          root     = ET.parse(ADDON_DIR / "addon.xml").getroot()
          addon_id = root.attrib["id"]
          version  = root.attrib["version"]

          # Addon ZIP
          zip_path = DIST / f"{addon_id}-{version}.zip"
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
              for fp in sorted(ADDON_DIR.rglob("*")):
                  if fp.is_file():
                      rel = fp.relative_to(ADDON_DIR)
                      if not skip(rel):
                          zf.write(fp, Path(addon_id) / rel)
          print(f"Addon ZIP: {zip_path} ({zip_path.stat().st_size} bytes)")

          # Repository addon ZIP
          rroot    = ET.parse(REPO_DIR / "addon.xml").getroot()
          repo_id  = rroot.attrib["id"]
          repo_ver = rroot.attrib["version"]
          repo_zip = DIST / f"{repo_id}-{repo_ver}.zip"
          with zipfile.ZipFile(repo_zip, "w", zipfile.ZIP_DEFLATED) as zf:
              for fp in sorted(REPO_DIR.rglob("*")):
                  if fp.is_file():
                      zf.write(fp, Path(repo_id) / fp.relative_to(REPO_DIR))
          print(f"Repo ZIP:  {repo_zip} ({repo_zip.stat().st_size} bytes)")

          # addons.xml
          ax = (ADDON_DIR / "addon.xml").read_text(encoding="utf-8")
          ax = re.sub(r"<\?xml[^?]*\?>\s*", "", ax).strip()
          addons_xml = f'<?xml version="1.0" encoding="UTF-8"?>\n<addons>\n{ax}\n</addons>\n'
          (DIST / "addons.xml").write_text(addons_xml, encoding="utf-8")
          md5 = hashlib.md5(addons_xml.encode()).hexdigest()
          (DIST / "addons.xml.md5").write_text(md5, encoding="utf-8")
          print(f"addons.xml generated (md5: {md5})")

          # List dist/
          print("\ndist/ contents:")
          for f in sorted(DIST.iterdir()):
              print(f"  {f.name:50s} {f.stat().st_size:>8d} bytes")
          EOF

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kodi-addon-${{ github.sha }}
          path: dist/
          retention-days: 30

  # ── 6. GitHub Pages deploy (only on push to main) ─────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: kodi-addon-${{ github.sha }}
          path: dist/

      - name: Deploy dist/ to gh-pages branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or update gh-pages branch
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # Copy dist files to root
          cp dist/addons.xml     ./addons.xml
          cp dist/addons.xml.md5 ./addons.xml.md5
          cp dist/*.zip          ./  2>/dev/null || true

          git add addons.xml addons.xml.md5 *.zip
          git diff --staged --quiet || \
            git commit -m "Deploy repository files [skip ci]"
          git push origin gh-pages
